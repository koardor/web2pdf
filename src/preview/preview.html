<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>截图预览</title>
<link rel="stylesheet" href="preview.css">
</head>
<body>
  <header class="bar">
    <div class="info">
      <div class="name" title=""></div>
      <div class="meta"></div>
    </div>
    <div class="controls">
      <div class="zoom" role="group" aria-label="显示大小">
        <button data-zoom="fit" class="on">适应宽度</button>
        <button data-zoom="actual">原始大小</button>
      </div>
      <fieldset class="formats">
        <label><input type="radio" name="format" value="pdf">PDF</label>
        <label><input type="radio" name="format" value="png">PNG</label>
        <label><input type="radio" name="format" value="jpeg">JPEG</label>
      </fieldset>
      <button class="save primary">保存</button>
      <button class="retake">重新截图</button>
      <button class="cancel">取消</button>
    </div>
  </header>
  <p class="status" hidden></p>
  <main class="stage fit"><div class="shot"></div></main>
  <script src="../lib/filename.js"></script>
  <script src="../lib/tiles.js"></script>
  <script src="preview.js"></script>
</body>
</html>
